site_name: Q-SYNTH — Information Engines and Policy Synthesis
site_description: From information engines and feedback control to QUBO, Ising models, QAOA and quantum benchmarking
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
exclude_docs: |
  /logbook.md
nav:
  - Home: index.md
  - Start here:
      - Informatics engineering students: start-informatics.md
      - Collaborators: start-collaborators.md
  - Project:
      - Q-SYNTH overview: overview.md
      - Architecture: architecture.md
      - Interdisciplinary roadmap: roadmap.md
      - Synthesis and validation workflow: workflow.md
  - Physical context:
      - Information engine: information-engine.md
      - Stochastic thermodynamics: thermodynamics.md
      - FPGA and real-time control: fpga.md
  - Quantum engineering:
      - Policy-map optimization: optimization.md
      - IE cost matrix: ie-cost-matrix.md
      - QUBO representation: qubo-ising.md
      - Ising mapping: ising.md
      - Quantum circuits and QAOA: qaoa.md
      - Coupled policy maps: coupled-policy.md
      - Simulation with Qiskit Aer: simulation.md
      - Benchmarking: benchmarking.md
  - Reproducibility:
      - Environment: environment.md
      - Notebook sequence and review: notebook-sequence.md
      - Seminar visuals: seminar-assets.md
  - Reference:
      - Acronyms & concepts: glossary.md
      - References: references.md
